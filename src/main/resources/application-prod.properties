# ==================== PRODUCTION PROFILE ====================
# File này chỉ được load khi: spring.profiles.active=prod
# 
# QUAN TRỌNG: Không commit secrets vào git!
# Dùng Environment Variables hoặc AWS Secrets Manager

server.port=8080

# ==================== DATABASE (Production - AWS RDS) ====================
# Đọc từ Environment Variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings cho production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ==================== JPA/HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=validate
# validate: Chỉ kiểm tra schema, KHÔNG tự động thay đổi DB
# Production phải dùng migration tool (Flyway/Liquibase)

# KHÔNG show SQL trong production (performance + security)
spring.jpa.show-sql=false

# ==================== JWT (Production - token ngắn hơn = bảo mật hơn) ====================
jwt.access-token-expiration=300000
jwt.refresh-token-expiration=86400000
# access-token: 5 phút (ngắn hơn = an toàn hơn)
# refresh-token: 1 ngày

# ==================== LOGGING (Production mode) ====================
logging.level.root=WARN
logging.level.com.example.demo=INFO
# Chỉ log WARN và ERROR để tránh log quá nhiều

# ==================== SECURITY ====================
# HTTPS (khi deploy với reverse proxy)
# server.ssl.enabled=true
