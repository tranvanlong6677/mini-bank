spring.application.name=mini-bank

# ==================== ACTIVE PROFILE ====================
# Chọn profile: dev, staging, prod
# Có thể override bằng: java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=dev

# ==================== JWT CONFIG (chung cho tất cả môi trường) ====================
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456789}
# ${JWT_SECRET:default} = Lấy từ env variable JWT_SECRET, nếu không có thì dùng default

# ==================== COMMON CONFIG ====================
# Config không đổi giữa các môi trường