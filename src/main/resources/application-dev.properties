# ==================== DEV PROFILE ====================
# File này chỉ được load khi: spring.profiles.active=dev

server.port=7000

# ==================== DATABASE (Local PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/minibank
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA/HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
# update: Tự động update schema - tiện cho dev

# Debug: Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT (Dev - token sống lâu hơn để dễ test) ====================
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
# access-token: 15 phút
# refresh-token: 7 ngày

# ==================== LOGGING (Debug mode) ====================
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
# DEBUG level giúp bạn thấy chi tiết request/response

# ==================== FEIGN CLIENT ====================
external.jsonplaceholder.url=https://jsonplaceholder.typicode.com
